[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "crawlora-opendota"
version = "0.1.0"
description = "Crawlora OpenDota API client with 30 endpoints for Dota 2 matches, heroes, players, teams, leagues, statistics, and game constants"
readme = "README.md"
keywords = ["crawlora", "api-client", "sdk", "web-scraping", "scraping-api", "opendota", "opendota-api", "opendota-scraper", "opendota-data", "opendota-dota-2-matches", "opendota-heroes", "opendota-players", "opendota-teams", "opendota-leagues", "opendota-statistics", "opendota-game-constants"]
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Crawlora" }]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Typing :: Typed",
]
dependencies = ["typing-extensions>=4.7; python_version < '3.11'"]

[project.optional-dependencies]
async = ["httpx>=0.27"]
test = ["mypy>=1.11", "pytest>=8"]

[project.urls]
Homepage = "https://crawlora.net/?utm_source=pypi&utm_medium=referral&utm_campaign=platform-clients&utm_content=opendota-python-homepage"
Documentation = "https://crawlora.net/docs?utm_source=pypi&utm_medium=referral&utm_campaign=platform-clients&utm_content=opendota-python-api-docs"
Repository = "https://github.com/Crawlora-org/crawlora-opendota"

[tool.setuptools.packages.find]
where = ["."]
include = ["crawlora_opendota"]

[tool.setuptools.package-data]
"crawlora_opendota" = ["py.typed", "*.pyi"]
